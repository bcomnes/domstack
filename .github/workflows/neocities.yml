name: Deploy DOMStack website to Neocities

on:
  push:
    branches:
      - master

env:
  FORCE_COLOR: 1

concurrency: # prevent concurrent deploys doing starnge things
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        check-latest: true
    - run: npm i
    - name: Deploy website to Neocities
      run: npm run deploy
      env:
        NEOCITIES_API_TOKEN: ${{ secrets.NEOCITIES_DOMSTACK_API_TOKEN }}
